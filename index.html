/* VOICE: koç gibi; kısa, net, sabah enerjisi
   IDEA: spor salonu duvarındaki 21 günlük antrenman panosu
   PICTURE: dev gün numarası + 21 çentikli ilerleme şeridi, altında bugünün çalışma listesi
   COLOUR and TYPE: mercan kırmızısı bant, sıcak kum zemin, kobalt işaret; Barlow Condensed + Barlow
   LAYOUT: telefon önce tek sütun, sekmeli; geniş ekranda iki sütun */
:root{color-scheme:light dark;--bg:light-dark(#f5f1ea,#111113);--card:light-dark(#fff,#1b1b1f);--ink:light-dark(#18171b,#f2eee8);--mut:light-dark(#6a655d,#a39e96);--line:light-dark(#e5ddd1,#2c2c32);--hot:light-dark(#d9402a,#ff6a4d);--band:light-dark(#e0452c,#7a2415);--acc:light-dark(#1d4ed8,#7b97ff);--soft:light-dark(#fbe1d9,#3a1c16);--cool:light-dark(#dfe7ff,#1b2550)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,.cd{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,6vw,48px)}h2{font-size:26px;margin-bottom:4px}
h3{font-size:17px;color:var(--hot);margin:18px 0 2px}
p{margin:6px 0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(4vw,16px)}
.top{background:var(--band);color:#fff;position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
body{padding-bottom:env(safe-area-inset-bottom)}
.wrap{padding-left:max(4vw,16px,env(safe-area-inset-left));padding-right:max(4vw,16px,env(safe-area-inset-right))}
.top .wrap:first-child{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}
.brand{font:700 22px/1 "Barlow Condensed",sans-serif}
.sync{font-size:13px;opacity:.85;text-align:right}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs a{flex:none;color:#fff;text-decoration:none;padding:12px 14px 10px;font-weight:600;border-bottom:3px solid transparent;opacity:.78}
.tabs a[aria-current=page]{opacity:1;border-color:#fff}
.band{background:var(--band);color:#fff;padding:14px 0 28px}
.band .lead{opacity:.92;max-width:60ch}
.dnav{display:flex;align-items:center;gap:14px}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-size:24px;line-height:1;cursor:pointer}
.ib:disabled{opacity:.3;cursor:default}
.dno{font-size:clamp(68px,17vw,116px);line-height:.88}
.dno span{font-size:.38em;opacity:.7;margin-left:4px}
.ddate{font-weight:500;opacity:.92}
.pill{display:inline-block;background:#fff;color:var(--band);font-weight:700;font-size:14px;border-radius:999px;padding:3px 12px;margin-top:8px}
.strip{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));gap:3px;margin:20px 0 18px}
.strip button{height:28px;border:0;padding:0;border-radius:3px;background:linear-gradient(to top,#fff var(--f),rgba(255,255,255,.25) 0);cursor:pointer;position:relative}
.strip button:nth-child(7n):not(:last-child){margin-right:5px}
.strip .s{outline:2px solid #fff;outline-offset:2px}
.strip .t::after{content:"";position:absolute;left:50%;bottom:-9px;width:5px;height:5px;border-radius:50%;background:#fff;transform:translateX(-50%)}
.sessrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.score{text-align:right}.score b{display:block;font:700 52px/1 "Barlow Condensed",sans-serif}.score small{opacity:.85}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;padding-block:22px;align-items:start}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 10px;margin-bottom:20px}
.card .sub{color:var(--mut);font-size:15px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;position:relative}
h3+.row{border-top:0}
.row input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:26px;height:26px;border:2px solid var(--mut);border-radius:7px;display:grid;place-items:center}
.row input:checked+.box{background:var(--acc);border-color:var(--acc)}
.row input:checked+.box::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.row input:focus-visible+.box{outline:3px solid var(--acc);outline-offset:2px}
.row:has(input:checked) .txt b{text-decoration:line-through;opacity:.55}
.txt b{display:block;font-weight:600}
.txt small{display:block;color:var(--mut);font-size:14px;line-height:1.4}
.dose{font:600 19px/1.2 "Barlow Condensed",sans-serif;white-space:nowrap;text-align:right}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid currentColor;background:transparent;color:inherit;font:600 16px Barlow,sans-serif;cursor:pointer}
.btn.hot{background:var(--hot);border-color:var(--hot);color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 8px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=number],input[type=date]{width:100%;font:16px Barlow,sans-serif;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
label.f{display:block;font-size:14px;color:var(--mut);font-weight:500}
.timer{transition:background .25s,color .25s}
.timer.w{background:var(--hot);color:#fff;border-color:transparent}
.timer.r{background:var(--cool)}
.tbig{display:flex;flex-direction:column;align-items:center;padding:6px 0 10px}
.tbig .ph{font-weight:700;letter-spacing:.02em}
#tt{font-size:clamp(76px,20vw,112px);line-height:1;font-variant-numeric:tabular-nums}
.tin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.timer.w label.f,.timer.w .sub{color:#fff}
.timer.w .btn.hot{background:#fff;color:var(--hot);border-color:#fff}
.inl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;margin:8px 0 10px}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.phases div{border-top:2px solid rgba(255,255,255,.6);padding-top:8px}
.phases b{display:block;font-size:26px}.phases span{font-weight:700}.phases small{display:block;opacity:.85;font-size:14px}
@media(max-width:600px){.phases{grid-template-columns:minmax(0,1fr)}}
.pg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tile{aspect-ratio:1/1.15;border-radius:10px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;position:relative;overflow:hidden}
.tile>*{position:relative}
.tile .fl{position:absolute;inset:auto 0 0 0;height:var(--f);background:var(--soft)}
.tile .n{font:700 24px/1 "Barlow Condensed",sans-serif}
.tile .l{font-size:13px;line-height:1.1}
.tile.d{background:var(--hot);border-color:var(--hot);color:#fff}
.tile.t{border:2.5px solid var(--ink)}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:13px;color:var(--mut);text-align:center;margin-bottom:4px}
ul.ls{margin:6px 0 10px;padding-left:20px}ul.ls li{margin:6px 0}
ol.eq{margin:8px 0 10px;padding-left:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 28px}ol.eq li{margin:6px 0}
.kc{font-size:clamp(68px,16vw,110px);line-height:.9}.kc span{font-size:.3em;opacity:.8;margin-left:6px}
.macs{display:grid;gap:10px;margin-top:18px;max-width:560px}
.mac{display:grid;grid-template-columns:6.5em minmax(0,1fr) 4em;gap:12px;align-items:center;font-weight:600}
.mac>span:last-child{text-align:right;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.25)}.bar i{display:block;height:100%;background:#fff;border-radius:5px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-block:22px}
.menu .card{margin:0}
.menu .card.t{border:2px solid var(--hot)}
.ml{padding:9px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.ml .s{grid-column:1/-1;font-size:13px;color:var(--hot);font-weight:700}
.ml small{grid-column:1/-1;color:var(--mut);font-size:14px;line-height:1.4}
.k{font:600 17px/1.2 "Barlow Condensed",sans-serif;white-space:nowrap;text-align:right}
.tot{display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding:9px 0 4px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:4px 0 18px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats b{display:block;font:700 30px/1.1 "Barlow Condensed",sans-serif;white-space:nowrap}.stats small{color:var(--mut)}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-size:14px;color:var(--mut);font-weight:600}
.x{border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;min-width:44px;min-height:40px}
.wf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}
@media(max-width:600px){.wf{grid-template-columns:repeat(2,minmax(0,1fr))}.wf .btn{grid-column:1/-1}}
details{margin-top:6px}summary{cursor:pointer;font-weight:600;padding:8px 0;min-height:44px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.note{font-size:13px;color:var(--mut)}
.when{margin:0 0 2px;font-weight:700;color:var(--hot);font-size:14px}
.txt small.sl{color:var(--hot);font-weight:600;font-size:13px}
.bigw{font-size:clamp(64px,15vw,104px);line-height:.9}.bigw span{font-size:.32em;opacity:.8;margin-left:6px}
.demo{display:inline-flex;align-items:center;gap:7px;margin-top:6px;min-height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--acc);font:600 14px Barlow,sans-serif;cursor:pointer}
.demo::before{content:"";border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.row:has(input:checked) .demo{opacity:.7}
.ov{position:fixed;inset:0;background:rgba(10,8,6,.55);display:grid;place-items:end center;z-index:30}
.sheet{background:var(--card);color:var(--ink);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 20px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{place-items:center;padding:20px}.sheet{border-radius:18px}}
.shd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stage{background:var(--bg);border-radius:14px;aspect-ratio:4/3;margin:10px 0;overflow:hidden}
.stage svg{width:100%;height:100%;display:block}
ol.steps{margin:8px 0;padding-left:22px}ol.steps li{margin:6px 0}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
@media(prefers-reduced-motion:reduce){.timer{transition:none}}
</style>
</head>

/* ---------- grafik ---------- */
let ro=null;
function drawChart(){
 const s=$('#wchart');if(!s)return;const W=s.clientWidth,H=s.clientHeight;if(!W||!H)return;
 const a=ws();if(!a.length){s.innerHTML='';return}
 const x0=a[0].d<S.start?a[0].d:S.start,end=add(S.start,20),x1=a[a.length-1].d>end?a[a.length-1].d:end;
 const base=firstW(),tEnd=base-1*20/7;
 const vals=a.map(x=>x.kg).concat([base,tEnd]);let lo=Math.floor(Math.min(...vals)-.5),hi=Math.ceil(Math.max(...vals)+.5);if(hi-lo<4)hi=lo+4;
 const m={l:38,r:16,t:14,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b,span=Math.max(1,diff(x0,x1));
 const X=d=>m.l+diff(x0,d)/span*iw,Y=v=>m.t+(hi-v)/(hi-lo)*ih;
 const step=hi-lo>10?2:1;let g='';
 for(let v=lo;v<=hi;v+=step)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--mut)">${v}</text>`;
 const ticks=W<520?[1,11,21]:[1,8,15,21];
 ticks.forEach((k,ti)=>{const d=add(S.start,k-1);g+=`<text x="${X(d)}" y="${H-8}" text-anchor="${ti===ticks.length-1&&X(d)>W-40?'end':'middle'}" font-size="12" fill="var(--mut)">Gün ${k}</text>`});
 const sx=X(S.start);
 g+=`<line x1="${sx}" y1="${Y(base)}" x2="${X(end)}" y2="${Y(tEnd)}" stroke="var(--acc)" stroke-width="2" stroke-dasharray="6 5"/>`;
 g+=`<polyline fill="none" stroke="var(--hot)" stroke-width="2.5" stroke-linejoin="round" points="${a.map(x=>X(x.d)+','+Y(x.kg)).join(' ')}"/>`;
 g+=a.map(x=>`<circle cx="${X(x.d)}" cy="${Y(x.kg)}" r="4" fill="var(--card)" stroke="var(--hot)" stroke-width="2.5"/>`).join('');
 const L=a[a.length-1],lx=X(L.d),anc=lx>W-60?'end':'middle';
 g+=`<text x="${lx}" y="${Y(L.kg)-10}" text-anchor="${anc}" font-size="13" font-weight="700" fill="var(--ink)">${nf(L.kg)}</text>`;
 s.innerHTML=g;
}

/* ---------- zamanlayıcı ---------- */
const T={on:false,ph:'w',left:0,r:0,iv:null,ac:null};
function beep(f,d){try{if(!T.ac)T.ac=new(window.AudioContext||window.webkitAudioContext)();const o=T.ac.createOscillator(),gn=T.ac.createGain(),t=T.ac.currentTime;o.frequency.value=f;o.connect(gn);gn.connect(T.ac.destination);gn.gain.setValueAtTime(.25,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const tcfg=()=>({w:Math.max(5,+$('#tw').value||30),r:Math.max(5,+$('#trs').value||60),n:Math.max(1,+$('#tn').value||6)});
function tdraw(){const c=$('#timer');if(!c)return;const n=tcfg().n;c.classList.toggle('w',T.r>0&&T.ph==='w');c.classList.toggle('r',T.r>0&&T.ph==='r');$('#tt').textContent=mmss(Math.max(0,T.left));$('#tph').textContent=T.r===0?($('#tph').dataset.done?'Bitti, harika iş':'Hazır'):(T.ph==='w'?'Çalış':'Dinlen');$('#tr').textContent=`Tur ${T.r} / ${n}`;$('#tgo').textContent=T.on?'Duraklat':(T.r>0?'Devam':'Başlat')}
function tick(){const c=tcfg();T.left--;if(T.left>0&&T.left<=3)beep(520,.08);
 if(T.left<=0){if(T.ph==='w'){if(T.r>=c.n){tstop();$('#tph').dataset.done=1;T.r=0;T.left=c.w;beep(990,.6);tdraw();return}T.ph='r';T.left=c.r;beep(440,.35)}else{T.r++;T.ph='w';T.left=c.w;beep(880,.35)}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
 tdraw()}
function tstop(){clearInterval(T.iv);T.iv=null;T.on=false}
function tgo(){if(T.on){tstop();tdraw();return}const c=tcfg();delete $('#tph').dataset.done;if(T.r===0){T.r=1;T.ph='w';T.left=c.w;beep(880,.35)}T.on=true;T.iv=setInterval(tick,1000);tdraw()}
function treset(){tstop();T.r=0;T.ph='w';T.left=tcfg().w;delete $('#tph').dataset.done;tdraw()}

for(const k in X){const x=X[k];if(x.A)x.B=Object.assign({},x.A,x.B||{})}
function ik(b,t,l1,l2,s){const dx=t[0]-b[0],dy=t[1]-b[1];let d=Math.hypot(dx,dy)||.01;const a=Math.atan2(dy,dx);d=Math.min(d,l1+l2-.01);const c=Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d)));const th=a+s*Math.acos(c);const j=[b[0]+l1*Math.cos(th),b[1]+l1*Math.sin(th)];const ea=Math.atan2(t[1]-j[1],t[0]-j[0]);return[j,[j[0]+l2*Math.cos(ea),j[1]+l2*Math.sin(ea)]]}
function lerpP(A,B,k){const o={};for(const key in A){const a=A[key],b=B[key];o[key]=Array.isArray(a)?a.map((v,i)=>v+(b[i]-v)*k):typeof a==='number'?a+(b-a)*k:a}return o}
const pt=q=>q[0].toFixed(1)+' '+q[1].toFixed(1);
function figure(P,x,tm){
 const front=x.v==='front',tr=P.t*Math.PI/180,u=[Math.sin(tr),-Math.cos(tr)],hip=P.p,neck=[hip[0]+46*u[0],hip[1]+46*u[1]];
 const ph=Math.atan2(u[1],u[0])+(P.ht||0)*Math.PI/180,head=[neck[0]+14*Math.cos(ph),neck[1]+14*Math.sin(ph)];
 const pr=[-u[1],u[0]];let s1=neck,s2=neck,h1=hip,h2=hip;
 if(front){s1=[neck[0]+13*pr[0]-3*u[0],neck[1]+13*pr[1]-3*u[1]];s2=[neck[0]-13*pr[0]-3*u[0],neck[1]-13*pr[1]-3*u[1]];h1=[hip[0]+7*pr[0],hip[1]+7*pr[1]];h2=[hip[0]-7*pr[0],hip[1]-7*pr[1]]}
 if(x.bike){const a=tm*2*Math.PI/x.d;P.f1=[130+15*Math.cos(a),140+15*Math.sin(a)];P.f2=[130-15*Math.cos(a),140-15*Math.sin(a)]}
 const eb=P.eb??1,kb=P.kb??-1;
 const [e1,w1]=ik(s1,P.w1,24,22,eb),[e2,w2]=ik(s2,P.w2,24,22,front?-eb:eb),[k1,f1]=ik(h1,P.f1,30,30,kb),[k2,f2]=ik(h2,P.f2,30,30,front?-kb:kb);
 const J={w1,w2,f1,f2,k1,k2,e1,e2};
 const lim=(a,b,c,col)=>`<path d="M${pt(a)} L${pt(b)} L${pt(c)}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
 const far=front?'var(--ink)':'var(--mut)';
 let g=`<line x1="10" x2="240" y1="162" y2="162" stroke="var(--line)" stroke-width="3"/>`;
 if(x.box){const b=x.box;g+=`<rect x="${b[0]}" y="${b[1]+3}" width="${b[2]}" height="${b[3]}" rx="3" fill="var(--soft)" stroke="var(--mut)"/>`}
 if(x.wall)g+=`<rect x="194" y="16" width="12" height="146" fill="var(--soft)" stroke="var(--mut)"/>`;
 if(x.bike){g+=`<g stroke="var(--mut)" stroke-width="5" stroke-linecap="round" fill="none"><path d="M92 160 H190 M112 104 L130 140 L164 140 L160 76 M100 103 H122 M156 74 H170"/><circle cx="172" cy="128" r="20"/></g><path d="M${pt(P.f1)} L${pt(P.f2)}" stroke="var(--ink)" stroke-width="3"/>`}
 g+=lim(s2,e2,w2,far)+lim(h2,k2,f2,far);
 const mid=[(hip[0]+neck[0])/2,(hip[1]+neck[1])/2],n=[u[1],-u[0]],c=P.c||0,ctl=[mid[0]+c*n[0],mid[1]+c*n[1]];
 g+=`<path d="M${pt(hip)} Q${pt(ctl)} ${pt(neck)}" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round"/>`;
 if(front)g+=`<path d="M${pt(s1)} L${pt(s2)} M${pt(h1)} L${pt(h2)}" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>`;
 g+=`<circle cx="${head[0].toFixed(1)}" cy="${head[1].toFixed(1)}" r="9.5" fill="var(--ink)"/>`;
 g+=lim(h1,k1,f1,'var(--ink)')+lim(s1,e1,w1,'var(--ink)');
 (x.band||[]).forEach(b=>{g+=`<line x1="${J[b[0]][0].toFixed(1)}" y1="${J[b[0]][1].toFixed(1)}" x2="${J[b[1]][0].toFixed(1)}" y2="${J[b[1]][1].toFixed(1)}" stroke="var(--hot)" stroke-width="3" stroke-linecap="round"/>`});
 if(x.db)[w2,w1].forEach((w,i)=>{g+=`<rect x="${(w[0]-8).toFixed(1)}" y="${(w[1]-4).toFixed(1)}" width="16" height="8" rx="2.5" fill="${i||front?'var(--acc)':'var(--mut)'}"/>`});
 return g;
}
let draf=null;
function closeDemo(){cancelAnimationFrame(draf);draf=null;const o=$('#ov');if(o)o.remove()}
function openDemo(id){
 const x=X[id];if(!x)return;closeDemo();
 const q=encodeURIComponent(x.q);

 o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="shd"><h2 id="dt">${x.n}</h2><button class="x" data-act="dclose" aria-label="Kapat">×</button></div>

  <ol class="steps">${x.s.map(z=>`<li>${z}</li>`).join('')}</ol>
  <p><b>Sık hata:</b> ${x.e}</p>
  <div class="btns"><a class="btn hot" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTube'da izle</a><button class="btn" data-act="dclose">Kapat</button></div>
  <p class="note">Link YouTube'da hareketin İngilizce adıyla arama açar.</p></div>`;
 document.body.appendChild(o);
 o.addEventListener('click',e=>{if(e.target===o)closeDemo()});
 const cb=o.querySelector('[data-act=dclose]');try{cb.focus()}catch(e){}
 if(x.none)return;
 const sv=$('#dsv'),red=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
 const frame=now=>{const tm=(now-t0)/1000,k=red?1:(1-Math.cos(2*Math.PI*tm/(x.d||3)))/2;sv.innerHTML=figure(lerpP(x.A,x.B,x.bike?0:k),x,red?0:tm);if(!red)draf=requestAnimationFrame(frame)};
 frame(t0);
}
